name: Test
description: Run yarn test
inputs:
  args:
    description: Extra arguments appended to yarn test run
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: yarn
    - run: yarn install --immutable
      shell: bash
    - run: yarn test run $ARGS
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
