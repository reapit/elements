name: Test
description: Run yarn test
inputs:
  args:
    description: Extra arguments appended to yarn test run
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: 24
        cache: yarn
    - run: yarn install --immutable
      shell: bash
    - run: yarn test run $ARGS
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
