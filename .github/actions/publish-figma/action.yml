name: Publish Figma Code Connect
description: Publish Code Connect definitions to Figma
inputs:
  args:
    description: Extra arguments appended to figma connect publish
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: yarn
    - run: yarn install --immutable
      shell: bash
    # Code Connect definitions and figma.config.json both live in the elements workspace.
    - run: yarn workspace @reapit/elements exec figma connect publish $ARGS
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
        FIGMA_ACCESS_TOKEN: ${{ env.FIGMA_ACCESS_TOKEN }}
