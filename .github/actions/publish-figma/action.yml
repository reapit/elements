name: Publish Figma Code Connect
description: Publish Code Connect definitions to Figma
inputs:
  args:
    description: Extra arguments appended to figma connect publish
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: yarn
    - run: yarn install --immutable
      shell: bash
    - run: yarn figma connect publish $ARGS
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
