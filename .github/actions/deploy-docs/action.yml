name: Deploy Docs
description: Deploy pre-built Storybook to Cloudflare Workers
inputs:
  target:
    description: "Deploy target (dev, prod, v4)"
    required: true
runs:
  using: composite
  steps:
    - name: Validate target
      run: |
        case "$TARGET" in
          dev|prod|v4) ;;
          *)
            echo "::error::Invalid target '$TARGET'. Valid values are dev, prod, v4."
            exit 1
            ;;
        esac
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
    - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
      with:
        apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        wranglerVersion: "4"
        # wrangler.jsonc and the ./public/dist assets it serves both live in the
        # elements workspace, so wrangler has to run from there.
        workingDirectory: packages/elements
        # The action infers the package manager from a lockfile and falls back to npm
        # when it finds none. The lockfile is at the repo root, not in the workspace,
        # so state yarn explicitly: npm fails on peer conflicts that yarn only warns about.
        packageManager: yarn
        command: >-
          ${{ inputs.target == 'v4'
            && 'deploy --config wrangler.v4.jsonc'
            || format('deploy --env {0}', inputs.target) }}
