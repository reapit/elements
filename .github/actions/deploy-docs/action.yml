name: Deploy Docs
description: Deploy pre-built Storybook to Cloudflare Workers
inputs:
  target:
    description: 'Deploy target (dev, prod, v4)'
    required: true
runs:
  using: composite
  steps:
    # No Node setup or yarn install needed — cloudflare/wrangler-action bundles
    # its own Node runtime and manages all dependencies internally.
    - name: Validate target
      run: |
        case "$TARGET" in
          dev|prod|v4) ;;
          *)
            echo "::error::Invalid target '$TARGET'. Valid values are dev, prod, v4."
            exit 1
            ;;
        esac
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
    - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
      with:
        apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        wranglerVersion: '4'
        command: >-
          ${{ inputs.target == 'v4'
            && 'deploy --config wrangler.v4.jsonc'
            || format('deploy --env {0}', inputs.target) }}
