name: Deploy Docs
description: Deploy pre-built Storybook to Cloudflare Workers
inputs:
  target:
    description: "Deploy target (dev, prod, v4)"
    required: true
runs:
  using: composite
  steps:
    - name: Validate target
      run: |
        case "$TARGET" in
          dev|prod|v4) ;;
          *)
            echo "::error::Invalid target '$TARGET'. Valid values are dev, prod, v4."
            exit 1
            ;;
        esac
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: 24
    - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
      with:
        apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        wranglerVersion: "4"
        command: >-
          ${{ inputs.target == 'v4'
            && 'deploy --config wrangler.v4.jsonc'
            || format('deploy --env {0}', inputs.target) }}
