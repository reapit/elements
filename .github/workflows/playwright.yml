name: Visual Regression Tests

# DS-136: Disabled — this workflow was permanently failing and costing ~USD 200/month.
# Re-enable by restoring the push and workflow_call triggers once the root cause is fixed.
on:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: 'Update snapshots?'
        type: boolean

env:
  NPM_TOKEN: ${{secrets.NPM_TOKEN}}
  CI: true

jobs:
  test:
    timeout-minutes: 120
    runs-on:
      group: rpt-gbl-linux-x64
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Set Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright Browsers
        run: yarn playwright install --with-deps

      - name: Build Docs
        run: |
          yarn build:docs

      - name: Set up cache
        id: cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          key: cache/${{github.repository}}/${{github.ref}}
          restore-keys: cache/${{github.repository}}/refs/heads/main
          path: .visual-test/**

      - name: Initialize snapshots
        if: ${{steps.cache.outputs.cache-hit != 'true' || inputs.update-snapshots == true}}
        run: yarn playwright test --update-snapshots

      - name: Run Playwright tests
        run: yarn playwright test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-report
          path: .visual-test/spec/results/
          retention-days: 30
          overwrite: true
