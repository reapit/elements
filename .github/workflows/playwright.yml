name: Visual Regression Tests

# DS-136: Disabled, this workflow was permanently failing and costing ~USD 200/month.
# Re-enable by restoring the push and workflow_call triggers once the root cause is fixed.
on:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: "Update snapshots?"
        type: boolean

env:
  NPM_TOKEN: ${{secrets.NPM_TOKEN}}
  CI: true

jobs:
  test:
    timeout-minutes: 120
    runs-on:
      group: rpt-gbl-linux-x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright Browsers
        run: yarn workspace @reapit/elements exec playwright install --with-deps

      - name: Build Docs
        run: |
          yarn build:docs

      - name: Set up cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cache/${{github.repository}}/${{github.ref}}
          restore-keys: cache/${{github.repository}}/refs/heads/main
          path: packages/elements/.visual-test/**

      - name: Initialize snapshots
        if: ${{steps.cache.outputs.cache-hit != 'true' || inputs.update-snapshots == true}}
        run: yarn workspace @reapit/elements exec playwright test --update-snapshots

      - name: Run Playwright tests
        run: yarn workspace @reapit/elements exec playwright test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-report
          path: packages/elements/.visual-test/spec/results/
          retention-days: 30
          overwrite: true
