name: Test PR

on:
  pull_request:
    types: ['opened', 'synchronize', 'reopened', 'edited']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  pr-lint:
    name: Lint Title
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        with:
          # Keep in sync with the allowed types in CONTRIBUTING.md.
          types: |
            feat
            fix
            chore
            ci
            docs
            refactor
            revert
          disallowScopes: |
            .+
          subjectPattern: ^(?:[A-Z]+-\d+ )?.*\S.*$
          subjectPatternError: |
            The subject "{subject}" does not match the required format.
            Titles must follow conventional commit format: type: description
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Check
    if: github.event.action != 'edited'
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/check

  test:
    name: Unit Tests
    if: github.event.action != 'edited'
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/test
        with:
          args: --coverage --silent
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 1

  build:
    name: Build
    if: github.event.action != 'edited'
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build-lib

  docs:
    name: Docs
    if: github.event.action != 'edited'
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build-docs

  figma:
    name: Figma Code Connect
    # Non-main branches never publish to Figma, so validation is only
    # meaningful for PRs targeting main.
    if: github.event.action != 'edited' && github.base_ref == 'main'
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/publish-figma
        with:
          args: --dry-run --exit-on-unreadable-files
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}

  codacy:
    name: Codacy
    needs: test
    # Coverage is reported on PRs only — this is where it is most actionable,
    # giving reviewers visibility over untested additions before merge.
    continue-on-error: true
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 10
    steps:
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage/
      - name: Upload to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage/report/lcov.info
