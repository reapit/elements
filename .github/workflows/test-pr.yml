name: Test PR

on:
  pull_request:
    types: ['opened', 'synchronize']

env:
  NPM_TOKEN: ${{secrets.NPM_TOKEN}}
  AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
  AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
  AWS_REGION: ${{secrets.AWS_REGION}}
  CODACY_PROJECT_TOKEN: ${{secrets.CODACY_PROJECT_TOKEN}}
  CI: true

jobs:
  pr-lint:
    name: Lint Title
    runs-on:
      group: rpt-gbl-linux-x64
    steps:
      - uses: seferov/pr-lint-action@v1.2.0
        with:
          title-regex: '^(?:(?:\[WIP\] ?)?(?:build|ci|chore|docs|task|feat|fix|perf|refactor|revert|style|test)!?\:(?:\ +?#\d+?\ +?)?.*)|(?:\[Snyk\].*)'
          title-regex-flags: 'g'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-close-message: 'Closing this pull request since the title does not match %pattern% pattern. Please fix the title and re-open the pull request.'

  check:
    name: Type Check
    runs-on:
      group: rpt-gbl-linux-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install
        run: yarn install --immutable

      - name: Check
        run: yarn check

  test:
    name: Unit Tests
    runs-on:
      group: rpt-gbl-linux-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install
        run: yarn install --immutable

      - name: Test
        run: yarn test run --passWithNoTests --coverage --silent

      - name: Codacy Checks
        run: bash <(curl -Ls https://coverage.codacy.com/get.sh)

  build:
    name: Build
    runs-on:
      group: rpt-gbl-linux-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install
        run: yarn install --immutable

      - name: Build
        run: yarn build
