name: Test PR

on:
  pull_request:
    types: ['opened', 'synchronize']

env:
  CI: true

jobs:
  pr-lint:
    name: Lint Title
    runs-on:
      group: rpt-gbl-linux-x64
    steps:
      - uses: seferov/pr-lint-action@v2.0.0
        with:
          title-regex: '^(?:(?:\[WIP\] ?)?(?:build|ci|chore|docs|task|feat|fix|perf|refactor|revert|style|test)!?\:(?:\ +?(?:#\d+|[A-Z]+-\d+)\ +?)?.*)|(?:\[Snyk\].*)'
          title-regex-flags: 'g'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-close-message: 'Closing this pull request since the title does not match %pattern% pattern. Please fix the title and re-open the pull request.'

  check:
    name: Check
    runs-on:
      group: rpt-gbl-linux-x64
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/check

  test:
    name: Unit Tests
    runs-on:
      group: rpt-gbl-linux-x64
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/test
        with:
          args: --coverage --silent
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 1

  build:
    name: Build
    runs-on:
      group: rpt-gbl-linux-x64
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build-lib

  docs:
    name: Docs
    runs-on:
      group: rpt-gbl-linux-x64
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build-docs

  figma:
    name: Figma Code Connect
    runs-on:
      group: rpt-gbl-linux-x64
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/publish-figma
        with:
          args: --dry-run --exit-on-unreadable-files
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}

  codacy:
    name: Codacy
    needs: test
    # Coverage is reported on PRs only — this is where it is most actionable,
    # giving reviewers visibility over untested additions before merge.
    continue-on-error: true
    runs-on:
      group: rpt-gbl-linux-x64
    steps:
      - name: Download coverage
        uses: actions/download-artifact@v7
        with:
          name: coverage
          path: coverage/
      - name: Upload to Codacy
        run: bash <(curl -Ls https://coverage.codacy.com/get.sh)
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
