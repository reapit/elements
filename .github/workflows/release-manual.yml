name: Release (Manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (SHA, branch, or tag) to check out and release from. For recovery, use the full commit SHA of the version-bump merge commit.'
        type: string
        required: true
      tag:
        description: 'Git tag to create. Leave blank to derive automatically from package.json at the specified ref (e.g. v5.0.0-beta.81). Provide an explicit value only to override the default format.'
        type: string
        required: false
      create_github_release:
        description: 'Create a GitHub Release using release notes extracted from CHANGELOG.md. Skipped if the release already exists.'
        type: boolean
        required: false
        default: true
      publish_npm:
        description: 'Publish to npm. Skipped if the version is already present on npm.'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

env:
  CI: true

jobs:
  release-manual:
    name: Release (Manual)
    runs-on:
      group: rpt-gbl-linux-x64
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Generate App Token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        id: checkout
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node
        uses: actions/setup-node@v6
        id: setup-node
        with:
          node-version: 24
          cache: yarn

      - name: Install
        id: install
        run: yarn install --immutable

      - name: Derive Version and Tag
        id: derive-tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Derived version: ${VERSION}"
          echo "Derived tag: ${TAG}"

      - name: Validate Tag
        id: validate-tag
        run: |
          TAG="${{ steps.derive-tag.outputs.tag }}"
          HEAD_SHA=$(git rev-parse HEAD)
          # Prefer the peeled commit SHA (refs/tags/<tag>^{}) so annotated tags
          # resolve correctly; fall back to the raw ref SHA for lightweight tags.
          PEELED=$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | awk '{print $1}')
          RAW=$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')
          REMOTE_SHA="${PEELED:-$RAW}"

          if [ -z "${REMOTE_SHA}" ]; then
            echo "Tag ${TAG} does not exist yet — will create."
            exit 0
          fi

          if [ "${REMOTE_SHA}" = "${HEAD_SHA}" ]; then
            echo "Tag ${TAG} already exists at this ref — skipping tag creation."
            echo "skip_tag=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Error: Tag ${TAG} already exists and points to ${REMOTE_SHA}, not ${{ inputs.ref }}. Aborting to prevent tagging the wrong commit."
          exit 1

      - name: Check
        id: check
        run: yarn check

      - name: Test
        id: test
        run: yarn test run

      - name: Build
        id: build
        run: yarn build:lib

      - name: Create and Push Tag
        id: push-tag
        if: steps.validate-tag.outputs.skip_tag != 'true'
        run: |
          TAG="${{ steps.derive-tag.outputs.tag }}"
          git tag "${TAG}"
          git push origin "${TAG}"
          echo "Pushed tag ${TAG}."

      - name: Create GitHub Release
        id: create-release
        if: inputs.create_github_release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TAG="${{ steps.derive-tag.outputs.tag }}"
          VERSION="${{ steps.derive-tag.outputs.version }}"

          if gh release view "${TAG}" 2>/dev/null; then
            echo "GitHub Release ${TAG} already exists — skipping."
            exit 0
          fi

          NOTES=$(awk "/^## ${VERSION}$/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md | sed '/^$/d')

          if [ -z "${NOTES}" ]; then
            echo "::error::No changelog entry found for version ${VERSION} in CHANGELOG.md. Aborting release creation."
            exit 1
          fi

          PRERELEASE_FLAG=""
          if echo "${VERSION}" | grep -q '\-'; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "${TAG}" \
            ${PRERELEASE_FLAG} \
            --title "${TAG}" \
            --notes "${NOTES}" \
            --target "${{ inputs.ref }}"

          echo "Created GitHub Release ${TAG}."

      - name: Publish to npm
        id: publish-npm
        if: inputs.publish_npm
        run: |
          # Use `yarn changeset publish` rather than `yarn npm publish` so that
          # Changesets' pre-flight npm-info check handles already-published
          # versions and new packages gracefully. `--no-git-tag` suppresses the
          # post-publish git tagging, which this workflow manages separately.
          #
          # Authentication uses OIDC trusted publishing — npm exchanges the
          # GitHub Actions OIDC token for a short-lived publish token.
          #
          # Provenance attestation is intentionally disabled. This workflow
          # checks out an arbitrary inputs.ref, but the OIDC token subject
          # reflects the workflow run ref (the default branch), so the
          # attestation would point at the wrong source commit.
          yarn changeset publish --no-git-tag

          # Note: this workflow intentionally does not create a GitHub
          # deployment record. It exists solely as a recovery tool for when
          # the automated release workflow fails. In that scenario the
          # corresponding Jira release should be marked as released manually.
          # Emitting a deployment record here would risk duplicating the
          # automated workflow's record and could point at a different commit
          # than the one Jira expects (since this workflow checks out an
          # arbitrary ref rather than the HEAD of main).
