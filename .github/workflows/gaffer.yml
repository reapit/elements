name: Gaffer

on:
  pull_request:
    types: ["opened", "synchronize", "reopened", "ready_for_review"]

concurrency:
  group: gaffer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  classify:
    name: Classify
    # Runs on every push to a non-draft PR so classification stays accurate
    # after further changes.
    if: "!github.event.pull_request.draft"
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 10
    steps:
      # Dependabot-authored PRs get a read-only default GITHUB_TOKEN
      # regardless of the permissions block above, so classification (which
      # needs to add labels and post a comment) authenticates as the GH App
      # instead.
      - name: Generate app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Use base-branch policy
        run: git fetch origin ${{ github.event.pull_request.base.sha }} && git checkout ${{ github.event.pull_request.base.sha }} -- .gaffer/policy.yml

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - name: Classify PR
        id: classify
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node --experimental-strip-types packages/gaffer/classify-pr.ts ${{ github.event.pull_request.number }}

      - name: Post classification comment
        uses: ./actions/sticky-comment
        with:
          marker: gaffer-classification
          body: ${{ steps.classify.outputs.comment }}
          issue-number: ${{ github.event.pull_request.number }}
          github-token: ${{ steps.app-token.outputs.token }}
