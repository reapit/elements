# Deploy Storybook to Cloudflare Workers.
#
# Triggers:
#   workflow_call     → caller specifies target (used by release.yml for automated dev/prod deploys)
#   workflow_dispatch → manual deploy with a target dropdown (used for v4 and emergency deploys)

name: Deploy Docs

on:
  workflow_call:
    inputs:
      target:
        description: 'Deploy target. Valid values: dev, prod, v4'
        type: string
        default: 'dev'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        type: choice
        options:
          - dev
          - prod
          - v4
        default: 'dev'

permissions:
  contents: read

env:
  CI: true

jobs:
  deploy-docs:
    name: Deploy Docs (${{ inputs.target || 'dev' }})
    runs-on:
      group: rpt-gbl-linux-x64
    steps:
      # Fail fast if someone manually triggers a prod deploy from a non-main
      # branch. workflow_call events from release.yml always originate from
      # main so this guard only fires for workflow_dispatch.
      # Note: v4 is intentionally excluded — it must be deployable from
      # non-main branches (e.g. the lts branch) to keep the LTS storybook
      # up to date independently of main.
      - name: Guard production deploy
        if: >-
          github.event_name == 'workflow_dispatch'
          && inputs.target == 'prod'
          && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production deploys are only permitted from the main branch."
          exit 1

      # Resolve the target once so every subsequent step reads from a
      # single source of truth. On workflow_call events inputs.target is
      # set by the caller; on workflow_dispatch it comes from the dropdown.
      - name: Resolve target
        id: target
        run: |
          TARGET="${{ inputs.target || 'dev' }}"
          case "$TARGET" in
            dev|prod|v4) ;;
            *)
              echo "::error::Invalid target '$TARGET'. Valid values are dev, prod, v4."
              exit 1
              ;;
          esac
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6

      - name: Build Docs
        uses: ./.github/actions/build-docs

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.ANZ_CLOUDFLARE_TOKEN }}
          accountId: ${{ secrets.ANZ_CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: >-
            ${{ steps.target.outputs.target == 'v4'
              && 'deploy --config wrangler.v4.jsonc'
              || format('deploy --env {0}', steps.target.outputs.target) }}
