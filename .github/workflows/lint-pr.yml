name: Lint PR

on:
  pull_request:
    types: ["opened", "synchronize", "reopened", "edited"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-lint:
    name: Title
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        with:
          # Keep in sync with the allowed types in CONTRIBUTING.md.
          types: |
            feat
            fix
            chore
            ci
            docs
            refactor
            revert
          disallowScopes: |
            .+
          subjectPattern: ^(?:[A-Z]+-\d+ )?.*\S.*$
          subjectPatternError: |
            The subject "{subject}" does not match the required format.
            Titles must follow conventional commit format: type: description
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
