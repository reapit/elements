# Deploy Storybook to Cloudflare Workers.
#
# Triggers:
#   push to main   → always deploys dev (canary.elements.reapit.com.au)
#   workflow_call   → caller specifies target (used by release.yml for prod)
#   workflow_dispatch → manual deploy with a target dropdown

name: Deploy Storybook

on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      target:
        description: 'Deploy target. Valid values: dev, prod, v4'
        type: string
        default: 'dev'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        type: choice
        options:
          - dev
          - prod
          - v4
        default: 'dev'

permissions:
  contents: read

env:
  CI: true

jobs:
  deploy-storybook:
    name: Deploy Storybook (${{ inputs.target || 'dev' }})
    runs-on:
      group: rpt-gbl-linux-x64
    steps:
      # Fail fast if someone manually triggers a prod deploy from a non-main
      # branch. Push events always target dev so this guard only fires for
      # workflow_dispatch.
      # Note: v4 is intentionally excluded — it must be deployable from
      # non-main branches (e.g. the lts branch) to keep the LTS storybook
      # up to date independently of main.
      - name: Guard production deploy
        if: >-
          github.event_name == 'workflow_dispatch'
          && inputs.target == 'prod'
          && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production deploys are only permitted from the main branch."
          exit 1

      # Resolve the target once so every subsequent step reads from a
      # single source of truth. On push events inputs.target is
      # undefined, so the fallback defaults to dev.
      - name: Resolve target
        id: target
        run: |
          TARGET="${{ inputs.target || 'dev' }}"
          case "$TARGET" in
            dev|prod|v4) ;;
            *)
              echo "::error::Invalid target '$TARGET'. Valid values are dev, prod, v4."
              exit 1
              ;;
          esac
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Install
        run: yarn install --immutable

      - name: Build Storybook
        run: yarn build:storybook

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.ANZ_CLOUDFLARE_TOKEN }}
          accountId: ${{ secrets.ANZ_CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --env ${{ steps.target.outputs.target }}
