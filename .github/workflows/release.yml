name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CI: true

jobs:
  check:
    name: Check
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/check

  test:
    name: Test
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/test

  build:
    name: Build
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build-lib
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  release:
    name: Release
    needs: [check, test, build]
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 15
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # fetch-depth: 0 is required here — changesets needs full history to
          # determine which packages changed since the last release tag.
          # The parallel check/test/build jobs use the default shallow clone.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install
        run: yarn install --immutable

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          version: yarn changeset version
          publish: yarn changeset publish
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload npm debug logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: npm-debug-logs
          path: ~/.npm/_logs/

  record-release:
    name: Record Release
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 5
    environment: production
    steps:
      - name: Log published packages
        continue-on-error: true
        run: echo '${{ needs.release.outputs.publishedPackages }}' | jq .

  publish-figma:
    name: Publish Figma Code Connect
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/publish-figma
        with:
          args: --exit-on-unreadable-files
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}

  deploy-docs:
    name: Deploy Docs
    needs: release
    # Deploys to prod when packages were published, dev otherwise (version PR
    # created or no changesets present).
    uses: ./.github/workflows/deploy-docs.yml
    with:
      target: ${{ needs.release.outputs.published == 'true' && 'prod' || 'dev' }}
    secrets: inherit
