name: Release

on:
  push:
    branches:
      - main
      - lts
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (SHA, branch, or tag) to check out and release from. For recovery, use the full commit SHA of the version-bump merge commit.'
        type: string
        required: true
      tag:
        description: 'Git tag to create. Omit to derive from package.json at the specified ref (e.g. v5.0.0-beta.81). Provide a value only to override the default format.'
        type: string
        required: false
      create_github_release:
        description: 'Create a GitHub Release using release notes extracted from CHANGELOG.md. Skipped if the release already exists.'
        type: boolean
        required: false
        default: true
      publish_npm:
        description: 'Publish to npm. Skipped if the version is already present on npm.'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CI: true

jobs:
  check:
    name: Check
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/check

  test:
    name: Test
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/test

  build:
    name: Build
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/build-lib
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  docs:
    name: Docs
    if: github.event_name == 'push'
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-docs
      - name: Upload docs artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs
          path: public/dist/
          retention-days: 1

  release:
    name: Release
    if: github.event_name == 'push'
    needs: [check, test, build]
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth: 0 is required here — changesets needs full history to
          # determine which packages changed since the last release tag.
          # The parallel check/test/build jobs use the default shallow clone.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: yarn changeset version
          publish: yarn changeset publish
          title: 'chore: version packages'
          commit: 'chore: version packages'
          github-token: ${{ steps.app-token.outputs.token }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Upload npm debug logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-debug-logs
          path: ~/.npm/_logs/

  release-manual:
    name: Release (Manual)
    if: github.event_name == 'workflow_dispatch'
    needs: [check, test, build]
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Derive Version and Tag
        id: derive-tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Derived version: ${VERSION}"
          echo "Derived tag: ${TAG}"

      - name: Validate Tag
        id: validate-tag
        run: |
          TAG="${{ steps.derive-tag.outputs.tag }}"
          HEAD_SHA=$(git rev-parse HEAD)
          # Prefer the peeled commit SHA (refs/tags/<tag>^{}) so annotated tags
          # resolve correctly; fall back to the raw ref SHA for lightweight tags.
          PEELED=$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | awk '{print $1}')
          RAW=$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')
          REMOTE_SHA="${PEELED:-$RAW}"

          if [ -z "${REMOTE_SHA}" ]; then
            echo "Tag ${TAG} does not exist yet — will create."
            exit 0
          fi

          if [ "${REMOTE_SHA}" = "${HEAD_SHA}" ]; then
            echo "Tag ${TAG} already exists at this ref — skipping tag creation."
            echo "skip_tag=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Error: Tag ${TAG} already exists and points to ${REMOTE_SHA}, not ${{ inputs.ref }}. Aborting to prevent tagging the wrong commit."
          exit 1

      - name: Create and Push Tag
        if: steps.validate-tag.outputs.skip_tag != 'true'
        run: |
          TAG="${{ steps.derive-tag.outputs.tag }}"
          git tag "${TAG}"
          git push origin "${TAG}"
          echo "Pushed tag ${TAG}."

      - name: Create GitHub Release
        if: inputs.create_github_release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TAG="${{ steps.derive-tag.outputs.tag }}"
          VERSION="${{ steps.derive-tag.outputs.version }}"

          if gh release view "${TAG}" 2>/dev/null; then
            echo "GitHub Release ${TAG} already exists — skipping."
            exit 0
          fi

          NOTES=$(awk "/^## ${VERSION}$/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md | sed '/^$/d')

          if [ -z "${NOTES}" ]; then
            echo "::error::No changelog entry found for version ${VERSION} in CHANGELOG.md. Aborting release creation."
            exit 1
          fi

          PRERELEASE_FLAG=""
          if echo "${VERSION}" | grep -q '\-'; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "${TAG}" \
            ${PRERELEASE_FLAG} \
            --title "${TAG}" \
            --notes "${NOTES}" \
            --target "${{ inputs.ref }}"

          echo "Created GitHub Release ${TAG}."

      - name: Publish to npm
        if: inputs.publish_npm
        run: |
          # Use `yarn changeset publish` rather than `yarn npm publish` so that
          # Changesets' pre-flight npm-info check handles already-published
          # versions and new packages gracefully. `--no-git-tag` suppresses the
          # post-publish git tagging, which this workflow manages separately.
          #
          # Authentication uses OIDC trusted publishing — npm exchanges the
          # GitHub Actions OIDC token for a short-lived publish token.
          #
          # Provenance attestation is intentionally disabled. The OIDC token's
          # subject claim reflects the branch that triggered the workflow (the
          # default branch for workflow_dispatch), not the arbitrary inputs.ref
          # that was checked out and built. The resulting attestation would
          # misrepresent the source of the published package.
          yarn changeset publish --no-git-tag

      - name: Upload npm debug logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-debug-logs
          path: ~/.npm/_logs/

  record-release:
    name: Record Release
    needs: release
    if: needs.release.outputs.published == 'true' && github.ref_name == 'main'
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 5
    environment: production
    steps:
      - name: Log published packages
        continue-on-error: true
        run: echo '${{ needs.release.outputs.publishedPackages }}' | jq .

  publish-figma:
    name: Publish Figma Code Connect
    needs: release
    if: needs.release.outputs.published == 'true' && github.ref_name == 'main'
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/publish-figma
        with:
          args: --exit-on-unreadable-files
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}

  deploy-docs:
    name: Deploy Docs
    needs: [release, docs]
    # main: deploys to prod when published, dev otherwise.
    # lts: deploys to v4 when published only; skipped otherwise.
    if: github.ref_name == 'main' || needs.release.outputs.published == 'true'
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download docs artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs
          path: public/dist/
      - uses: ./.github/actions/deploy-docs
        with:
          # lts always deploys v4 docs; main deploys prod if published, otherwise dev
          target: ${{ github.ref_name == 'lts' && 'v4' || needs.release.outputs.published == 'true' && 'prod' || 'dev' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ANZ_CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ANZ_CLOUDFLARE_ACCOUNT_ID }}
