name: Cleanup Preview

on:
  pull_request:
    types: [closed]
  schedule:
    # Weekly Monday 3 am UTC — sweep orphaned preview Workers.
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  CI: true

jobs:
  cleanup:
    name: Remove PR Preview
    # Fork and Dependabot PRs run with a read-only GITHUB_TOKEN and no access to
    # secrets, so the wrangler delete and deployment updates would fail. Skip them.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Delete preview Worker
        # Wrangler unconditionally lists KV namespaces after deleting a Worker to
        # clean up legacy Workers Sites asset namespaces. Our previews use the
        # modern assets binding, not KV, so there is nothing to clean up — but the
        # lookup requires Workers KV Storage permission the token lacks, causing
        # wrangler to exit non-zero AFTER the Worker is already deleted. Tolerate
        # the failure so the subsequent steps still run; the weekly sweep backstops
        # any genuinely orphaned Workers.
        continue-on-error: true
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.ANZ_CLOUDFLARE_TOKEN }}
          accountId: ${{ secrets.ANZ_CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: delete --env preview --name gbl-ds-elements-pr-${{ github.event.pull_request.number }} --force
      - name: Update PR comment
        uses: ./actions/sticky-comment
        with:
          marker: storybook-preview
          mode: update-only
          body: |
            > [!NOTE]
            > ### 🧹 Storybook preview removed
            > The preview for this PR has been cleaned up.
          issue-number: ${{ github.event.pull_request.number }}
      - name: Deactivate deployments
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Mark every deployment for this PR inactive so the pull request no longer
          # shows an active preview deployment once it is closed.
          DEPLOYMENT_IDS=$(gh api "repos/${{ github.repository }}/deployments" \
            --paginate \
            --jq ".[] | select(.environment == \"pr-${PR}\") | .id")

          for ID in $DEPLOYMENT_IDS; do
            gh api "repos/${{ github.repository }}/deployments/${ID}/statuses" \
              -X POST \
              -f state=inactive
          done
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-administration: write
      - name: Delete environment
        # Environments created via the Deployments API are never garbage-collected
        # by GitHub, so they otherwise accumulate forever in Settings > Environments.
        # Deleting one requires the "administration" permission, which isn't
        # available to GITHUB_TOKEN, hence the app token. continue-on-error so a
        # transient failure here doesn't fail the whole job — the weekly sweep
        # below backstops anything missed.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api "repos/${{ github.repository }}/environments/pr-${PR}" -X DELETE

  sweep:
    name: Remove Orphaned Previews
    if: github.event_name == 'schedule'
    runs-on:
      group: rpt-gbl-linux-x64
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Delete orphaned preview Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ANZ_CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ANZ_CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Abort if the open-PR list can't be retrieved: an empty OPEN_PRS
          # would make every Worker look orphaned and delete active previews.
          if ! OPEN_PRS=$(gh pr list --state open --limit 1000 --json number --jq '.[].number'); then
            echo "Failed to list open PRs — aborting sweep to avoid deleting active previews." >&2
            exit 1
          fi

          # TODO: The Cloudflare API paginates at 100 results. If the account
          # accumulates more than 100 Workers, this request will miss some.
          RESPONSE=$(curl -f \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts")
          WORKERS=$(echo "$RESPONSE" | jq -r '.result[].id | select(startswith("gbl-ds-elements-pr-"))')

          for WORKER in $WORKERS; do
            # Extract the PR number from the worker name (gbl-ds-elements-pr-<number>).
            PR_NUM="${WORKER#gbl-ds-elements-pr-}"

            if echo "$OPEN_PRS" | grep -qx "$PR_NUM"; then
              echo "Skipping ${WORKER} — PR #${PR_NUM} is still open."
            else
              echo "Deleting orphaned Worker ${WORKER} (PR #${PR_NUM} is closed)."
              # Tolerate a single failed delete so one error doesn't abort the whole
              # sweep under `set -e`; the next weekly run will retry it.
              npx wrangler@4 delete --env preview --name "$WORKER" --force || true
            fi
          done
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-administration: write
          # Listing environments is a read operation and is gated on Actions
          # read access, distinct from the Administration permission needed
          # to delete one — see docs.github.com/en/rest/deployments/environments.
          permission-actions: read
      - name: Delete orphaned environments
        # Backstop for the per-PR "Delete environment" step above: if that step
        # is skipped (fork/Dependabot PR) or fails, the pr-<number> environment
        # would otherwise sit in Settings > Environments forever, since GitHub
        # never garbage-collects them on its own.
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          if ! OPEN_PRS=$(gh pr list --state open --limit 1000 --json number --jq '.[].number'); then
            echo "Failed to list open PRs — aborting sweep to avoid deleting active environments." >&2
            exit 1
          fi

          ENVIRONMENTS=$(GH_TOKEN="$APP_TOKEN" gh api "repos/${{ github.repository }}/environments" \
            --paginate \
            --jq '.environments[].name | select(startswith("pr-"))')

          for ENV in $ENVIRONMENTS; do
            PR_NUM="${ENV#pr-}"

            if echo "$OPEN_PRS" | grep -qx "$PR_NUM"; then
              echo "Skipping ${ENV} — PR #${PR_NUM} is still open."
            else
              echo "Deleting orphaned environment ${ENV} (PR #${PR_NUM} is closed)."
              GH_TOKEN="$APP_TOKEN" gh api "repos/${{ github.repository }}/environments/${ENV}" -X DELETE || true
            fi
          done
