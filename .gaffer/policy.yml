# Gaffer policy — deterministic gate configuration.
#
# This file is read by tools/gaffer/classify-gates.ts. Changing
# thresholds or category patterns here changes gate behaviour without a code
# change.

version: 1

# gaffer's own required status check. Must be added to the "Main branch
# protection" ruleset's required_status_checks once this reaches PR stage —
# it is what actually re-validates the gates at the current head SHA, since
# this repo's ruleset does not dismiss stale reviews on push.
statusCheckContext: gaffer/gate

# This repo's ruleset only allows squash merges (allowed_merge_methods:
# ["squash"] / allow_squash_merge only) — enablePullRequestAutoMerge fails
# with any other method.
mergeMethod: SQUASH

# Files excluded from substantive line/file counts. Globs are matched with
# minimatch against the repo-relative path.
sizeExemptGlobs:
  - "**/*.md"
  - "**/*.mdx"
  - "CHANGELOG.md"
  - "**/*.snap"
  - ".changeset/*.md"
  - "yarn.lock"
  - "**/*.png"
  - "**/*.jpg"
  - "**/*.jpeg"
  - "**/*.gif"
  - "**/*.webp"
  - "**/*.ico"
  - "**/*.svg"

# Tier ceilings, calibrated against ~150 merged PRs in this repo (median 5
# substantive lines / 1 file; p90 ~240 lines / 8 files). Matches PostHog's
# stamphog thresholds almost exactly — this repo's real distribution sits
# comfortably inside them.
sizeThresholds:
  hardCeiling:
    lines: 800
    files: 30
  tiers:
    t1a: { lines: 20, files: 3 } # trivial
    t1b: { lines: 100, files: 5 } # small
    t1c: { lines: 300, files: 15 } # medium
    # anything above t1c and at/under the hard ceiling is t1d (complex)

# Hard deny-list. Any changed file matching a pattern here makes the PR
# T2-never: the gate stage REFUSEs deterministically and the LLM reviewer is
# never invoked. Re-derived from this repo's actual blast-radius surface
# (no auth/billing/migrations here — this is a component library, not a
# backend service) rather than copied from PostHog's category set.
denyCategories:
  ci_cd:
    description: GitHub Actions workflows and composite actions
    pathPatterns:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "actions/**"
  secrets_workflow:
    description: Workflow/action changes that reference GitHub secrets
    pathPatterns:
      - ".github/workflows/**"
      - ".github/actions/**"
    contentPattern: 'secrets\.'
  deploy_infra:
    description: Cloudflare Workers deployment configuration
    pathPatterns:
      - "wrangler.jsonc"
      - "wrangler.v4.jsonc"
      - "workers/**"
  git_hooks:
    description: Local git hook scripts (can silently disable checks)
    pathPatterns:
      - ".husky/**"
  publish_release_config:
    description: Release/publish configuration (not package.json — see publish_release_manifest)
    pathPatterns:
      - ".changeset/config.json"
      - "changelog-format.js"
  publish_release_manifest:
    description: Dangerous package.json fields (scripts, toolchain, publish target, identity)
    pathPatterns:
      - "package.json"
    # Ordinary dependency add/bump/remove is NOT denied — only these fields are.
    contentPattern: '"(scripts|engines|packageManager|publishConfig|name)"\s*:'

# Scrutiny-floor categories. Not denied — the LLM still reviews these and
# can approve them — but the gate stage floors the tier at t1c-medium
# regardless of measured size, so a change here can never be waved through
# as "trivial" purely by line count. These are areas of frequent, legitimate
# design-system churn (unlike the deny-list above), so a hard deny would
# make the tool useless for normal component work.
scrutinyFloorCategories:
  design_tokens:
    description: Generated design tokens consumed by every component
    pathPatterns:
      - "src/tokens/**"
  codemods:
    description: Automated migration tooling run against consumer code
    pathPatterns:
      - "codemods/**"
  barrel_exports:
    description: Top-level barrel files controlling the public export surface
    pathPatterns:
      - "src/core/index.ts*"
      - "src/utils/index.ts*"
      - "src/lab/index.ts*"
      - "src/icons/index.ts*"
  figma_contract:
    description: Design-to-code contract other teams rely on
    pathPatterns:
      - "figma.config.json"
      - "**/*.figma.tsx"
  build_toolchain:
    description: Build, lint and format toolchain configuration
    pathPatterns:
      - "vite.config.ts"
      - "tsconfig*.json"
      - "wyw-in-js.config.cjs"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - "stylelint.config.js"
      - "playwright.config.ts"
  gaffer_agent:
    description: Gaffer's own implementation and policy (not the workflow — that is covered by ci_cd deny)
    pathPatterns:
      - "tools/gaffer/**"
      - ".gaffer/policy.yml"

# Advisory-only flags. Never change the gate verdict or tier — surfaced to
# the LLM reviewer as extra context so it can factor them into its judgement.
advisoryCategories:
  deprecated_touch:
    description: "AGENTS.md asks contributors to avoid modifying src/deprecated/"
    pathPatterns:
      - "src/deprecated/**"

# Dependency ecosystems used for the "manifest changed without a paired
# lockfile" integrity check. A manifest edit alone (dependency added/bumped/
# removed) with no matching lockfile change is a T2-never deny — it means
# `yarn install` was never run, or the lockfile was hand-edited.
dependencyEcosystems:
  node:
    manifests: ["package.json"]
    lockfiles: ["yarn.lock"]
