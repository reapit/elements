approvedGitRepositories: []

compressionLevel: mixed

enableGlobalCache: false

enableScripts: false

nodeLinker: pnpm

npmMinimalAgeGate: 7d

npmRegistryServer: "https://npm.pkg.reapitaccess.com/"

# These packages import a dependency by bare specifier without declaring it as a peer. In a
# single-package repo they resolved it by walking up to the root node_modules; in a workspace
# the dependency sits beside the package that declares it, so the peer has to be made explicit
# for Yarn to link it into their virtual instances.
packageExtensions:
  "@testing-library/jest-dom@*":
    peerDependencies:
      vitest: "*"
  "storybook@*":
    peerDependencies:
      "@storybook/react-vite": "*"
      # `storybook` depends on `use-sync-external-store`, which peer-depends on react without
      # anything in the chain providing it. Node never notices, because the CJS shim's
      # `require("react")` is resolved by walking up the directory tree; the browser's dep
      # optimizer has no such fallback and leaves the call as an unresolvable external.
      react: "*"
  # `@vitest/mocker` declares `vite` an optional peer, yet its Node entry point imports it
  # unconditionally. Nothing notices while the only consumer is `vitest`, which depends on `vite`
  # outright; `@vitest/browser-playwright` depends on the mocker too and does not, so the peer goes
  # unprovided and loading the Vitest config fails with "Cannot find package 'vite'".
  "@vitest/browser@*":
    peerDependencies:
      vite: "*"
  "@vitest/browser-playwright@*":
    peerDependencies:
      vite: "*"

plugins:
  - .yarn/plugins/plugin-git-lfs.cjs
  - .yarn/plugins/plugin-husky.cjs
  - .yarn/plugins/plugin-blame-ignore-revs.cjs

# The visual regression tests run inside the pinned Playwright Linux container (see
# scripts/test-visual.sh) against this same node_modules tree, so the Linux builds of the
# platform-specific optional dependencies (esbuild, rollup, lightningcss) have to sit alongside
# the host's own. On a Linux runner `current` already is `linux`, so this costs nothing in CI;
# it adds the second set of binaries only on macOS and Windows.
#
# This changes what an install materialises, not what it resolves, so `yarn.lock` is unaffected.
#
# `libc` has to be named alongside `os`: it defaults to `[current]`, macOS reports no libc at all,
# and a glibc-only package therefore resolves to a stub whose only content is
# `{ "mocked": true }`. The failure that follows is a native binding "not found" inside the
# container while the package sits in the Yarn cache, looking installed. Widening this list also
# needs `node_modules` deleted first, because an install will not replace a stub it has already
# materialised.
#
# `cpu` is left at its default. The container runs under the host's own architecture, and the
# baselines it produces are byte-identical to the ones the same image produces as linux/amd64, so
# a second set of binaries would buy nothing.
supportedArchitectures:
  libc: [current, glibc]
  os: [current, linux]

yarnPath: .yarn/releases/yarn-4.18.0.cjs
